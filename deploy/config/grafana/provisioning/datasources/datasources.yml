# Grafana 数据源配置
apiVersion: 1

datasources:
  # Prometheus 数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      queryTimeout: "30s"

  # Loki 数据源
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  # SkyWalking 数据源（使用 SkyWalking GraphQL）
  - name: SkyWalking
    type: apache-skywalking-graphql-datasource
    access: proxy
    url: http://skywalking-oap:12800/graphql
    editable: false
