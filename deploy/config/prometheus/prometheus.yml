# Prometheus 配置文件
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fba-logi-cluster'
    env: 'production'

# 告警规则
rule_files:
  - /etc/prometheus/rules/*.yml

# 告警管理器
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 抓取配置
scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot 应用
  - job_name: 'spring-boot-apps'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'fba-gateway:8080'
        labels:
          service: 'gateway'
      - targets:
          - 'fba-chat:8081'
        labels:
          service: 'chat'
      - targets:
          - 'fba-data:8082'
        labels:
          service: 'data'
      - targets:
          - 'fba-rag:8083'
        labels:
          service: 'rag'
    # Kubernetes 服务发现（生产环境使用）
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names:
    #         - fba-logi
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
    #     action: keep
    #     regex: true

  # Redis 指标
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-primary:6379'
        labels:
          role: 'primary'

  # PostgreSQL 指标（需要 postgres_exporter）
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets:
  #         - 'postgres-exporter:9187'

  # Milvus 指标
  - job_name: 'milvus'
    static_configs:
      - targets:
          - 'milvus-standalone:9091'

  # SkyWalking OAP 指标
  - job_name: 'skywalking'
    static_configs:
      - targets:
          - 'skywalking-oap:1234'

  # Loki 指标
  - job_name: 'loki'
    static_configs:
      - targets:
          - 'loki:3100'
