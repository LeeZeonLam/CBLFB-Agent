# 告警规则配置
groups:
  # 应用告警规则
  - name: application-alerts
    rules:
      # 服务宕机
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 宕机"
          description: "服务 {{ $labels.instance }} 已宕机超过 1 分钟"

      # 高错误率
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "服务 {{ $labels.service }} 错误率过高"
          description: "服务 {{ $labels.service }} 5xx 错误率超过 5%"

      # 高延迟
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "服务 {{ $labels.service }} 响应延迟过高"
          description: "服务 {{ $labels.service }} P95 响应时间超过 2 秒"

      # 内存使用过高
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用过高"
          description: "服务 {{ $labels.instance }} 堆内存使用率超过 85%"

      # GC 时间过长
      - alert: HighGCTime
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GC 时间过长"
          description: "服务 {{ $labels.instance }} GC 暂停时间过长"

  # 基础设施告警规则
  - name: infrastructure-alerts
    rules:
      # Redis 连接数过高
      - alert: RedisHighConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 连接数过高"
          description: "Redis {{ $labels.instance }} 连接数超过 100"

      # PostgreSQL 连接数过高
      - alert: PostgreSQLHighConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 连接数过高"
          description: "PostgreSQL 连接数超过 80"

      # Milvus 查询延迟
      - alert: MilvusHighLatency
        expr: milvus_query_duration_seconds > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Milvus 查询延迟过高"
          description: "Milvus 查询延迟超过 1 秒"

  # LLM 调用告警
  - name: llm-alerts
    rules:
      # LLM 调用失败率
      - alert: LLMHighFailureRate
        expr: rate(llm_requests_failed_total[5m]) / rate(llm_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "LLM 调用失败率过高"
          description: "LLM {{ $labels.provider }} 调用失败率超过 10%"

      # LLM 响应时间过长
      - alert: LLMHighLatency
        expr: histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM 响应时间过长"
          description: "LLM {{ $labels.provider }} P95 响应时间超过 30 秒"
