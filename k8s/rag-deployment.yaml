apiVersion: apps/v1
kind: Deployment
metadata:
  name: fba-logi-rag
  namespace: fba-logi
  labels:
    app: fba-logi-rag
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fba-logi-rag
  template:
    metadata:
      labels:
        app: fba-logi-rag
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: rag
          image: fba-logi-rag-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fba-logi-config
                  key: nacos.server-addr
            - name: MILVUS_HOST
              valueFrom:
                configMapKeyRef:
                  name: fba-logi-config
                  key: milvus.host
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fba-logi-secrets
                  key: deepseek-api-key
            - name: ZHIPU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fba-logi-secrets
                  key: zhipu-api-key
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
            # Kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: fba-logi-config
                  key: kafka.bootstrap-servers
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: fba-logi-config
                  key: kafka.consumer.group-id
            # SkyWalking Agent
            - name: SW_AGENT_NAME
              value: "fba-logi-rag"
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: "skywalking-oap.fba-logi:11800"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: fba-logi-rag-svc
  namespace: fba-logi
  labels:
    app: fba-logi-rag
spec:
  selector:
    app: fba-logi-rag
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  type: ClusterIP
