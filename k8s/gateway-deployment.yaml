apiVersion: apps/v1
kind: Deployment
metadata:
  name: fba-logi-gateway
  namespace: fba-logi
  labels:
    app: fba-logi-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fba-logi-gateway
  template:
    metadata:
      labels:
        app: fba-logi-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: gateway
          image: fba-logi-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fba-logi-config
                  key: nacos.server-addr
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC"
            - name: SW_AGENT_NAME
              value: "fba-logi-gateway"
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: "skywalking-oap.fba-logi:11800"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fba-logi-gateway-svc
  namespace: fba-logi
  labels:
    app: fba-logi-gateway
spec:
  selector:
    app: fba-logi-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
