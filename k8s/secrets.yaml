apiVersion: v1
kind: Secret
metadata:
  name: fba-logi-secrets
  namespace: fba-logi
  labels:
    app: fba-logi
type: Opaque
stringData:
  # 数据库密码（生产环境应使用 base64 编码或外部密钥管理）
  postgres-password: "CHANGE_ME_IN_PRODUCTION"

  # Redis 密码
  redis-password: "CHANGE_ME_IN_PRODUCTION"

  # LLM API Keys（生产环境应使用外部密钥管理如 HashiCorp Vault）
  deepseek-api-key: "CHANGE_ME_IN_PRODUCTION"
  zhipu-api-key: "CHANGE_ME_IN_PRODUCTION"
---
# 说明：
# 1. 此文件仅用于开发/测试环境
# 2. 生产环境应使用 Kubernetes Secrets 管理或外部密钥管理系统
# 3. 切勿将真实密钥提交到版本控制
# 4. 推荐使用 kubectl create secret 命令创建:
#
#    kubectl create secret generic fba-logi-secrets \
#      --namespace=fba-logi \
#      --from-literal=postgres-password='xxx' \
#      --from-literal=redis-password='xxx' \
#      --from-literal=deepseek-api-key='sk-xxx' \
#      --from-literal=zhipu-api-key='xxx'
