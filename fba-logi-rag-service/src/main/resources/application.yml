server:
  port: 8083

spring:
  application:
    name: fba-logi-rag-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:a1e36daf-0697-4125-81de-026d2b0e24de}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Milvus 配置
milvus:
  enabled: true
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  database: default

# LLM 配置
llm:
  provider: deepseek
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    model: glm-4-flash
    embedding-model: embedding-2

# 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志配置
logging:
  level:
    com.fba.logi: DEBUG
    io.milvus: DEBUG
