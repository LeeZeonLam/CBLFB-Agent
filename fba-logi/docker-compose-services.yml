version: '3.8'

services:
  # ==========================================
  # API 网关服务
  # ==========================================
  fba-gateway:
    image: fba-logi-gateway:v1
    container_name: fba-gateway
    restart: always
    environment:
      NACOS_SERVER_ADDR: fba-nacos:8848
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "10080:8080"
    networks:
      - fba-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================
  # 聊天微服务
  # ==========================================
  fba-chat:
    image: fba-logi-chat:v1
    container_name: fba-chat
    restart: always
    environment:
      NACOS_SERVER_ADDR: fba-nacos:8848
      DB_HOST: pg-primary
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fba_logi_db}
      DB_USER: ${POSTGRES_USER:-fba_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fba_secret_pass}
      REDIS_HOST: redis-primary
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      JAVA_OPTS: -Xms512m -Xmx1g
    ports:
      - "10081:8081"
    networks:
      - fba-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================
  # 数据微服务
  # ==========================================
  fba-data:
    image: fba-logi-data:v1
    container_name: fba-data
    restart: always
    environment:
      NACOS_SERVER_ADDR: fba-nacos:8848
      DB_HOST: pg-primary
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fba_logi_db}
      DB_USER: ${POSTGRES_USER:-fba_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fba_secret_pass}
      REDIS_HOST: redis-primary
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "10082:8082"
    networks:
      - fba-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================
  # RAG 微服务
  # ==========================================
  fba-rag:
    image: fba-logi-rag:v1
    container_name: fba-rag
    restart: always
    environment:
      NACOS_SERVER_ADDR: fba-nacos:8848
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "10083:8083"
    networks:
      - fba-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  fba-net:
    external: true
