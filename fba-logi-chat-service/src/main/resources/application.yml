server:
  port: 8081

spring:
  application:
    name: fba-logi-chat-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fba_logi_db}
    username: ${DB_USER:fba_admin}
    password: ${DB_PASSWORD:fba_secret_pass}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6378}
      password: ${REDIS_PASSWORD:fba_redis_pass}

# LLM 配置
llm:
  provider: ${LLM_PROVIDER:deepseek}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    model: glm-4-flash
    embedding-model: embedding-2

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志配置
logging:
  level:
    com.fba.logi: DEBUG
    dev.langchain4j: DEBUG
